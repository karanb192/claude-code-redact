name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate plugins/redact --strict
      - run: claude plugin test plugins/redact
